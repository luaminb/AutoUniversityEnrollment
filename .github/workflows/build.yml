name: Build University Class Preparation

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'university_class_preparation.py'
      - 'build.py'
      - 'tests/**'
      - 'tuning/**'
      - 'package-builder/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the Sims 4-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.17'

      - name: Show interpreter version
        run: python --version

      - name: Run mocked regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile the TS4 script archive
        run: python build.py

      - name: Set up .NET for DBPF package builder
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and validate tuning package
        run: dotnet run --project package-builder/PackageBuilder.csproj -- tuning/AUE_SePrepararParaAula.xml tuning/AUE_SePrepararParaAula_XmlInjector.xml UniversityClassPreparation.package "Se Preparar para a Aula"

      - name: Upload installable mod files
        uses: actions/upload-artifact@v4
        with:
          name: UniversityClassPreparation
          path: |
            UniversityClassPreparation.ts4script
            UniversityClassPreparation.package
          if-no-files-found: error
          retention-days: 14
