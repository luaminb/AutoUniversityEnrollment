name: Build Auto University Enrollment

on:
  workflow_dispatch:
  push:
    paths:
      - 'auto_university_enrollment.py'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the Sims 4-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.17'

      - name: Show interpreter version
        run: python --version

      - name: Run mocked regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile the TS4 script archive
        run: python build.py

      - name: Upload installable script archive
        uses: actions/upload-artifact@v4
        with:
          name: AutoUniversityEnrollment-ts4script
          path: AutoUniversityEnrollment.ts4script
          if-no-files-found: error
          retention-days: 14
